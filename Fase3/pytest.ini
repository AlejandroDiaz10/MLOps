# pytest configuration file

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options - Focus on core modules only
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=fase3.core
    --cov=fase3.pipeline_builder
    --cov=api
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    --maxfail=3
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, end-to-end)
    api: API tests (requires running server)
    slow: Slow tests (skipped in quick runs)
    data: Tests that require data files

# Coverage options
[coverage:run]
source = fase3.core,fase3.pipeline_builder,api
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov